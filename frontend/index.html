<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprimido</title>
    <link rel="icon" type="image/x-icon" href="img/comprimidinho.ico">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <img src="img/comprimidinho_transparente.ico" alt="">COMPRIMIDO
        </a>
        <div class="nav-menu">
            <button class="menu-button" id="menu-button">
                FERRAMENTAS
                <span class="menu-arrow">▼</span>
            </button>
            <div class="dropdown" id="dropdown">
                <a href="compress-pdf.html" class="dropdown-item">
                    COMPRIMIR PDF
                </a>

                <a href="convert-pdf.html" class="dropdown-item">
                    CONVERTER PARA PDF
                </a>

                <a href="merge-pdf.html" class="dropdown-item">
                    JUNTAR PDF
                </a>
            </div>
        </div>
    </nav>
    <main class="home">
        <header class="home-header">
            <span class="home-label">
                COMPRIMIDO
            </span>
            <h1>
                MAYBE IT'S COOL
            </h1>
            <p>
                Use sem moderação
            </p>
        </header>
        <section class="tools">
            <a href="compress-pdf.html" class="tool-card">
                <div class="tool-visual compress-pdf-visual">
                    <!-- Animação específica de compressão de PDF -->
                </div>
                <div class="tool-info">
                    <h2>COMPRIMIR PDF</h2>
                    <p>
                        Comprima seus arquivos PDF,
                        para diminuir o tamanho.
                    </p>
                </div>
            </a>
            <a href="convert-pdf.html" class="tool-card">
                <div class="tool-visual convert-pdf-visual">
                    <!-- Animação específica de conversão para PDF -->
                </div>
                <div class="tool-info">
                    <h2>CONVERTER PARA PDF</h2>
                    <p>
                        Transforme seus arquivos
                        em documentos PDF.
                    </p>
                </div>
            </a>

            <a href="merge-pdf.html" class="tool-card">
                <div class="tool-visual merge-pdf-visual">
                    <!-- Animação específica de união de PDFs -->
                </div>
                <div class="tool-info">
                    <h2>JUNTAR PDF</h2>
                    <p>
                        Junte vários arquivos PDF
                        em um único documento.
                    </p>
                </div>
            </a>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
