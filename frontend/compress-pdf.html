<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprimir PDF - Comprimido</title>
    <link rel="icon" type="image/x-icon" href="img/comprimidinho.ico">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <img src="img/comprimidinho_transparente.ico" alt="">COMPRIMIDO
        </a>
        <div class="nav-menu">
            <button class="menu-button" id="menu-button">
                FERRAMENTAS
                <span class="menu-arrow">▼</span>
            </button>
            <div class="dropdown" id="dropdown">
                <a href="compress-pdf.html" class="dropdown-item">
                    COMPRIMIR PDF
                </a>

                <a href="convert-pdf.html" class="dropdown-item">
                    CONVERTER PARA PDF
                </a>

                <a href="merge-pdf.html" class="dropdown-item">
                    JUNTAR PDF
                </a>
            </div>
        </div>
    </nav>
    <main class="container">
        <header class="header">
            <div class="logo">
                <span class="logo-main">
                    COMPRIMIDO
                </span>

                <span class="logo-sub">
                    MAYBE IT'S COOL
                </span>
            </div>
        </header>
        <section class="upload-section">
            <div class="upload-box">
                <div class="upload-content">
                    <div class="file-icon">
                        PDF
                    </div>
                    <h1 id="upload-title">ARRASTE SEU PDF</h1>
                    <p id="upload-info">
                        ou selecione um arquivo
                    </p>
                    <p id="upload-size"></p>
                    <button id="compress-button" class="compress-button">
                        COMPRIMIR
                    </button>
                    <button id="change-file" class="change-file">
                        trocar arquivo
                    </button>
                    <div id="processing" class="processing">
                        <span class="processing-text">
                            COMPRIMINDO...
                        </span>
                        <div class="processing-bar">
                            <div class="processing-progress"></div>
                        </div>
                    </div>
                    <button class="select-button">
                        SELECIONE O PDF
                    </button>
                    <input type="file" id="pdf-input" accept=".pdf" hidden>
                </div>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
