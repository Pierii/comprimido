<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprimido</title>
    <link rel="icon" type="image/x-icon" href="img/comprimidinho.ico">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="#" class="nav-logo">
            <img src="img/comprimidinho_transparente.ico" alt="">COMPRIMIDO
        </a>

        <div class="nav-menu">
            <button class="menu-button" id="menu-button">
                MAIS FUNÇÕES
                <span class="menu-arrow">▼</span>
            </button>

            <div class="dropdown" id="dropdown">
                <a href="#" class="dropdown-item active">
                    <span>01</span>
                    COMPRESS PDF
                </a>

                <a href="#" class="dropdown-item">
                    <span>02</span>
                    CONVERT 2 PDF
                </a>

                <a href="#" class="dropdown-item">
                    <span>03</span>
                    MERGE PDF
                </a>
            </div>
        </div>
    </nav>

    <main class="container">

        <header class="header">
            <div class="logo">
                <span class="logo-main">
                    COMPRIMIDO
                </span>

                <span class="logo-sub">
                    MAYBE IT'S COOL
                </span>
            </div>
        </header>

        <section class="upload-section">

            <div class="upload-box">

                <div class="upload-content">

                    <div class="file-icon">
                        PDF
                    </div>

                    <h1>
                        ARRASTE SEU PDF
                    </h1>

                    <p>
                        or selecione um arquivo do seu dispositivo
                    </p>

                    <button class="select-button">
                        SELECIONE O PDF
                    </button>

                    <input type="file" id="pdf-input" accept=".pdf" hidden>

                </div>

            </div>

        </section>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
